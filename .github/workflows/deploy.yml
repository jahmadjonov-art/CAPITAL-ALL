name: Deploy the site

# One GitHub Pages site serves two different things, and a Pages deployment
# replaces the whole site at once. Both therefore have to be built here, in a
# single workflow: a second workflow uploading its own Pages artifact would
# silently wipe whichever one deployed first.
#
#   /CAPITAL-ALL/          a front page listing the two, built by site/build.py.
#   /CAPITAL-ALL/budget/   the trucking budget PWA, archived in legacy/ and still
#                          in daily use. It served from the address above until
#                          2026-09-18 and moved down a level when the front page
#                          was added.
#   /CAPITAL-ALL/office/   the research programme: the five dashboards and the
#                          whole written record, built by site/build.py.
#
# This is the original app deploy workflow with the build moved under legacy/
# and the research site added beside it. It replaces deploy-legacy.yml, which
# replaced legacy/.github/workflows/deploy.yml.
#
# Do not split this into two workflows, and do not delete it while tidying —
# without it the trucking app does not go down, it freezes on the last build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The research site prints when each record last changed, read from
          # the git history. The default shallow clone would date every page to
          # this build instead.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: legacy/frontend/package-lock.json

      - name: Install the app's dependencies
        working-directory: legacy/frontend
        run: npm ci

      - name: Build the trucking app
        working-directory: legacy/frontend
        run: npm run build
        env:
          # vite.config.js defaults to the same value; keep it derived from the
          # repository name so a rename cannot silently break every asset URL.
          BASE_PATH: /${{ github.event.repository.name }}/budget/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the site generator's dependencies
        run: pip install -r site/requirements.txt

      - name: Assemble everything published at this address
        run: |
          python site/build.py --out _site
          mkdir -p _site/budget
          cp -R legacy/frontend/dist/. _site/budget/

      - name: Check the site built something
        run: |
          test -s _site/index.html                  # the front page
          test -s _site/budget/index.html           # the trucking app
          test -s _site/office/index.html           # the research front door
          test -s _site/office/tipsheet/index.html
          # The app must reference its own subdirectory, or every asset 404s.
          grep -q '/budget/assets/' _site/budget/index.html
          # And the worker that retires the app's old registration must be at
          # the root, where that registration still points.
          grep -q 'unregister' _site/sw.js
          echo "pages: $(find _site -name index.html | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
