<title>Volatility Surface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#05070A; --panel:#0B0F15; --sunk:#0F141B; --line:#1A222C; --line-2:#26323F;
  --txt:#D8E0E8; --dim:#8A96A4; --faint:#49535F;
  --iv:#2BD4E8; --gex:#FF3D82; --spot:#F5A524; --ok:#2FD67F;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:400 12.5px/1.6 "JetBrains Mono",ui-monospace,Menlo,monospace;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-inline:14px;padding-block:16px 48px}
h1,h2{margin:0}
.num{font-variant-numeric:tabular-nums}
.lbl{font-family:"Barlow Condensed","JetBrains Mono",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.17em;text-transform:uppercase;color:var(--faint)}
.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:baseline;justify-content:space-between;
  padding-bottom:12px;border-bottom:1px solid var(--line-2)}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:25px;letter-spacing:.05em}
.brand b{color:var(--iv)}
.stamp{font-size:11px;color:var(--faint);text-align:right;line-height:1.7}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin-top:13px;border-radius:3px;overflow:hidden}
.cell{background:var(--panel);padding:10px 13px}
.cell .v{font-size:19px;font-weight:700;margin-top:4px}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-top:8px}
.pill{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:2px;border:1px solid}
.pill.neg{color:#FF5757;border-color:#5A1A1A;background:#1C0A0A}
.pill.pos{color:var(--ok);border-color:#14442C;background:#08170F}
.warn{background:#1A1207;border:1px solid #3D2B0C;border-radius:3px;padding:11px 13px;
  color:#E0B968;font-size:12px;margin-top:12px}
.cell .s{font-size:10.5px;color:var(--faint);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-top:13px}
.card > header{padding:8px 13px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:center;gap:10px}
.card > .b{padding:12px}
svg{display:block;width:100%;height:auto}
.two{display:grid;grid-template-columns:1fr;gap:13px;margin-top:13px}
@media (min-width:900px){.two{grid-template-columns:1fr 1fr}}
.two .card{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:right;font-family:"Barlow Condensed",sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--faint);padding:0 8px 7px 0;border-bottom:1px solid var(--line-2)}
th:first-child,td:first-child{text-align:left}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);color:var(--dim);text-align:right}
td:last-child,th:last-child{padding-right:0}
tr:last-child td{border-bottom:none}
tr.wall td{color:var(--txt);background:rgba(255,61,130,.07)}
.note{background:var(--sunk);border-left:3px solid var(--spot);padding:10px 13px;border-radius:0 3px 3px 0;
  font-size:11.5px;color:var(--dim);margin-top:13px}
.note b{color:var(--txt)}
footer{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--faint)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 class="brand">VOLATILITY <b>SURFACE</b></h1>
      <div class="lbl" id="sub" style="margin-top:3px"></div>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>

  <section class="card" id="regimecard">
    <header><h2 class="lbl">Dealer gamma exposure</h2><span class="lbl" id="wallflag"></span></header>
    <div class="b">
      <div id="regimepill"></div>
      <div class="big num" id="netgex"></div>
      <div id="regimetext" style="color:var(--dim);max-width:64ch;margin-top:5px"></div>
    </div>
  </section>

  <div class="strip" id="strip"></div>

  <div class="two">
    <section class="card">
      <header><h2 class="lbl">Implied volatility — call vs put</h2><span class="lbl" id="ivlab"></span></header>
      <div class="b"><svg id="smile" role="img" aria-label="Implied volatility against strike"></svg></div>
    </section>
    <section class="card">
      <header><h2 class="lbl">Gamma by strike — calls up, puts down</h2><span class="lbl" id="gexlab"></span></header>
      <div class="b"><svg id="gex" role="img" aria-label="Gamma exposure against strike"></svg></div>
    </section>
  </div>

  <section class="card">
    <header><h2 class="lbl">The chain</h2><span class="lbl" id="nlab"></span></header>
    <div class="b" style="overflow-x:auto"><table id="tbl"></table></div>
  </section>

  <div class="note" id="honesty"></div>

  <footer id="foot"></footer>
</div>

  "net_total": -22863201291.397194,

  "floor_iv": 0.1211,
  "coverage_note": "46 strikes within 1.5% of spot, both sides, drawn from the full 0DTE expiry. The whole chain was 28,934 contracts in one request.",

  "snapshots_available": [
    "spxw-2026-09-11T2015Z.json",
    "spx-cboe-2026-09-14T1555Z.json"
  ]

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m$ = n => n>=1e9 ? "$"+(n/1e9).toFixed(2)+"B" : n>=1e6 ? "$"+(n/1e6).toFixed(0)+"M" : "$"+Math.round(n).toLocaleString();

$("sub").textContent = `${D.underlying} · ${D.chain} · expiry ${D.expiry} · calls and puts`;
$("stamp").innerHTML = `snapshot ${esc(D.captured)}<br>built ${esc(D.built)}`;
$("foot").textContent = `Rendered from ${D.snapshot}. Every figure fetched from the broker's option chain — none modelled, none invented.`;

const neg = D.net_total < 0;
$("regimepill").innerHTML = `<span class="pill ${neg?"neg":"pos"}">${neg?"▼":"▲"} ${D.regime} GAMMA</span>`;
$("netgex").innerHTML = `<span style="color:${neg?"#FF5757":"var(--ok)"}">${m$(Math.abs(D.net_total)).replace("$", neg?"$-":"$+")}</span>`;
$("regimetext").innerHTML = `net dealer gamma per 1% move in spot.<br><b style="color:var(--txt)">${esc(D.regime_text)}</b>`;
$("wallflag").textContent = D.walls_coincide ? "call wall = put wall" : "";

$("strip").innerHTML = [
  ["Spot (derived)", D.spot.toLocaleString("en-US",{maximumFractionDigits:0}), "delta-0.5 crossing"],
  ["Call wall", D.call_wall.toLocaleString(), m$(D.call_wall_gex)+" call gamma", "var(--gex)"],
  ["Put wall", D.put_wall.toLocaleString(), m$(D.put_wall_gex)+" put gamma", "var(--iv)"],
  ["Gamma flip", D.flip ? D.flip.toLocaleString() : "n/a",
   D.flip_reliable ? "regime boundary" : "at the edge of the sample — unreliable", "var(--spot)"],
  ["Max open interest", D.max_oi_strike.toLocaleString(), D.max_oi.toLocaleString()+" contracts · pin candidate"],
].map(([k,v,s2,c])=>`<div class="cell"><div class="lbl">${k}</div>
  <div class="v num" ${c?`style="color:${c}"`:""}>${v}</div><div class="s">${s2}</div></div>`).join("");

if (D.walls_coincide) $("strip").insertAdjacentHTML("afterend",
  `<div class="warn"><b>Call wall and put wall are the same strike.</b> One strike carrying the
   largest gamma on both sides behaves as a pin rather than a directional barrier — expect price to
   be drawn to it and to chop across it, rather than to reverse cleanly off it.</div>`);

const W=560, H=290, PL=54, PR=16, PT=16, PB=34;
const ks = D.rows.map(r=>r.k);
const kmin=Math.min(...ks), kmax=Math.max(...ks);
const x = k => PL + (k-kmin)/(kmax-kmin||1)*(W-PL-PR);
const xax = ts => ts.map(t=>`<text x="${x(t).toFixed(1)}" y="${H-PB+16}" text-anchor="middle"
  fill="var(--faint)" font-size="9.5" font-family="JetBrains Mono,monospace">${t.toLocaleString()}</text>`).join("");
const spotLine = h => `<line x1="${x(D.spot).toFixed(1)}" y1="${PT}" x2="${x(D.spot).toFixed(1)}" y2="${h}"
  stroke="var(--spot)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="${x(D.spot).toFixed(1)}" y="${PT-4}" text-anchor="middle" fill="var(--spot)" font-size="9.5"
   font-family="JetBrains Mono,monospace">SPOT ${D.spot.toLocaleString("en-US",{maximumFractionDigits:0})}</text>`;

/* ---- smile: both sides ---- */
(function(){
  const all=[...D.rows.map(r=>r.call_iv),...D.rows.map(r=>r.put_iv)];
  const lo=Math.min(...all)*0.96, hi=Math.max(...all)*1.04;
  const y = v => PT + (1-(v-lo)/(hi-lo))*(H-PT-PB);
  let g="";
  for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, yy=y(v).toFixed(1);
    g+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>
        <text x="${PL-7}" y="${(+yy+3).toFixed(1)}" text-anchor="end" fill="var(--faint)" font-size="9.5"
         font-family="JetBrains Mono,monospace">${(v*100).toFixed(1)}%</text>`; }
  g += spotLine(H-PB);
  [["call_iv","var(--iv)"],["put_iv","var(--gex)"]].forEach(([f,col])=>{
    g+=`<polyline points="${D.rows.map(r=>`${x(r.k).toFixed(1)},${y(r[f]).toFixed(1)}`).join(" ")}"
        fill="none" stroke="${col}" stroke-width="2"/>`;
    D.rows.forEach(r=>{g+=`<circle cx="${x(r.k).toFixed(1)}" cy="${y(r[f]).toFixed(1)}" r="3" fill="${col}"/>`;});
  });
  g+=`<text x="${W-PR}" y="${PT+11}" text-anchor="end" fill="var(--iv)" font-size="10"
      font-family="JetBrains Mono,monospace">calls</text>
      <text x="${W-PR}" y="${PT+24}" text-anchor="end" fill="var(--gex)" font-size="10"
      font-family="JetBrains Mono,monospace">puts</text>`;
  g += xax(ks);
  $("smile").setAttribute("viewBox",`0 0 ${W} ${H}`); $("smile").innerHTML=g;
  $("ivlab").textContent = `${(Math.min(...all)*100).toFixed(1)}% – ${(Math.max(...all)*100).toFixed(1)}%`;
})();

/* ---- gamma: calls above the axis, puts below ---- */
(function(){
  const mx=Math.max(...D.rows.map(r=>Math.max(r.call_gex,r.put_gex)))*1.1;
  const mid=(PT+(H-PB))/2;
  const y = v => mid - (v/mx)*((H-PB-PT)/2);
  const bw=Math.max(6,(W-PL-PR)/D.rows.length*0.4);
  let g=`<line x1="${PL}" y1="${mid}" x2="${W-PR}" y2="${mid}" stroke="var(--line-2)" stroke-width="1"/>`;
  [0.5,1].forEach(f=>{ [1,-1].forEach(sgn=>{ const yy=(mid-sgn*f*((H-PB-PT)/2)).toFixed(1);
    g+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>
        <text x="${PL-7}" y="${(+yy+3).toFixed(1)}" text-anchor="end" fill="var(--faint)" font-size="9.5"
         font-family="JetBrains Mono,monospace">${(mx*f/1e6).toFixed(0)}M</text>`; }); });
  g += spotLine(H-PB);
  D.rows.forEach(r=>{
    const isCW=r.k===D.call_wall, isPW=r.k===D.put_wall;
    const ytc=y(r.call_gex);
    g+=`<rect x="${(x(r.k)-bw).toFixed(1)}" y="${ytc.toFixed(1)}" width="${bw.toFixed(1)}"
        height="${(mid-ytc).toFixed(1)}" fill="var(--gex)" opacity="${isCW?1:.45}"/>`;
    const hp=(mid-y(r.put_gex));
    g+=`<rect x="${x(r.k).toFixed(1)}" y="${mid}" width="${bw.toFixed(1)}"
        height="${hp.toFixed(1)}" fill="var(--iv)" opacity="${isPW?1:.45}"/>`;
    if(isCW) g+=`<text x="${(x(r.k)-bw/2).toFixed(1)}" y="${(ytc-5).toFixed(1)}" text-anchor="middle"
        fill="var(--gex)" font-size="9.5" font-weight="700" font-family="JetBrains Mono,monospace">CALL WALL</text>`;
    if(isPW) g+=`<text x="${(x(r.k)+bw/2).toFixed(1)}" y="${(mid+hp+12).toFixed(1)}" text-anchor="middle"
        fill="var(--iv)" font-size="9.5" font-weight="700" font-family="JetBrains Mono,monospace">PUT WALL</text>`;
  });
  if(D.flip) g+=`<line x1="${x(D.flip).toFixed(1)}" y1="${PT}" x2="${x(D.flip).toFixed(1)}" y2="${H-PB}"
      stroke="var(--spot)" stroke-width="1.5"/>`;
  g += xax(ks);
  $("gex").setAttribute("viewBox",`0 0 ${W} ${H}`); $("gex").innerHTML=g;
  $("gexlab").textContent = `net ${D.net_total<0?"-":"+"}${m$(Math.abs(D.net_total)).slice(1)}`;
})();

/* ---- table ---- */
$("nlab").textContent = D.rows.length + " strikes";
$("tbl").innerHTML = `<thead><tr><th>Strike</th><th>Call IV</th><th>Put IV</th><th>Call OI</th>
  <th>Put OI</th><th>Call gamma $</th><th>Put gamma $</th><th>Net $ / 1%</th></tr></thead><tbody>` +
  D.rows.map(r=>`<tr class="${(r.k===D.call_wall||r.k===D.put_wall)?"wall":""}">
    <td class="num"><b>${r.k.toLocaleString()}</b></td>
    <td class="num" style="color:var(--iv)">${(r.call_iv*100).toFixed(2)}%</td>
    <td class="num" style="color:var(--gex)">${(r.put_iv*100).toFixed(2)}%</td>
    <td class="num">${r.call_oi.toLocaleString()}</td>
    <td class="num">${r.put_oi.toLocaleString()}</td>
    <td class="num" style="color:var(--gex)">${m$(r.call_gex)}</td>
    <td class="num" style="color:var(--iv)">${m$(r.put_gex)}</td>
    <td class="num" style="color:${r.net_gex<0?"#FF5757":"var(--ok)"}">${r.net_gex<0?"-":"+"}${m$(Math.abs(r.net_gex)).slice(1)}</td>
    </tr>`).join("") + "</tbody>";

$("honesty").innerHTML =
  `<b>What this is, and what it is not.</b> ${esc(D.captured_note)} ${esc(D.spot_method)}
   <br><br><b>Coverage:</b> ${esc(D.coverage_note)} ${esc(D.greeks_gap_note)}
   <br><br><b>Sign convention:</b> ${esc(D.convention)}
   <br><br><b>A true three-dimensional surface needs several expiries.</b> This is one slice through it.
   Adding expiries is one more pull from the same endpoint, not a different capability.`;
</script>
