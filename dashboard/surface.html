<title>Volatility Surface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#05070A; --panel:#0B0F15; --sunk:#0F141B; --line:#1A222C; --line-2:#26323F;
  --txt:#D8E0E8; --dim:#8A96A4; --faint:#49535F;
  --iv:#2BD4E8; --gex:#FF3D82; --spot:#F5A524; --ok:#2FD67F;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:400 12.5px/1.6 "JetBrains Mono",ui-monospace,Menlo,monospace;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-inline:14px;padding-block:16px 48px}
h1,h2{margin:0}
.num{font-variant-numeric:tabular-nums}
.lbl{font-family:"Barlow Condensed","JetBrains Mono",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.17em;text-transform:uppercase;color:var(--faint)}
.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:baseline;justify-content:space-between;
  padding-bottom:12px;border-bottom:1px solid var(--line-2)}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:25px;letter-spacing:.05em}
.brand b{color:var(--iv)}
.stamp{font-size:11px;color:var(--faint);text-align:right;line-height:1.7}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin-top:13px;border-radius:3px;overflow:hidden}
.cell{background:var(--panel);padding:10px 13px}
.cell .v{font-size:19px;font-weight:700;margin-top:4px}
.cell .s{font-size:10.5px;color:var(--faint);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-top:13px}
.card > header{padding:8px 13px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:center;gap:10px}
.card > .b{padding:12px}
svg{display:block;width:100%;height:auto}
.two{display:grid;grid-template-columns:1fr;gap:13px;margin-top:13px}
@media (min-width:900px){.two{grid-template-columns:1fr 1fr}}
.two .card{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:right;font-family:"Barlow Condensed",sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--faint);padding:0 8px 7px 0;border-bottom:1px solid var(--line-2)}
th:first-child,td:first-child{text-align:left}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);color:var(--dim);text-align:right}
td:last-child,th:last-child{padding-right:0}
tr:last-child td{border-bottom:none}
tr.wall td{color:var(--txt);background:rgba(255,61,130,.07)}
.note{background:var(--sunk);border-left:3px solid var(--spot);padding:10px 13px;border-radius:0 3px 3px 0;
  font-size:11.5px;color:var(--dim);margin-top:13px}
.note b{color:var(--txt)}
footer{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--faint)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 class="brand">VOLATILITY <b>SURFACE</b></h1>
      <div class="lbl" id="sub" style="margin-top:3px"></div>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>

  <div class="strip" id="strip"></div>

  <div class="two">
    <section class="card">
      <header><h2 class="lbl">Implied volatility by strike — the smile</h2><span class="lbl" id="ivlab"></span></header>
      <div class="b"><svg id="smile" role="img" aria-label="Implied volatility against strike"></svg></div>
    </section>
    <section class="card">
      <header><h2 class="lbl">Gamma exposure by strike — the wall</h2><span class="lbl" id="gexlab"></span></header>
      <div class="b"><svg id="gex" role="img" aria-label="Gamma exposure against strike"></svg></div>
    </section>
  </div>

  <section class="card">
    <header><h2 class="lbl">The chain</h2><span class="lbl" id="nlab"></span></header>
    <div class="b" style="overflow-x:auto"><table id="tbl"></table></div>
  </section>

  <div class="note" id="honesty"></div>

  <footer id="foot"></footer>
</div>

<script>
const D = {
  "built": "13 Sep 2026  21:42",
  "snapshot": "spxw-2026-09-11T2015Z.json",
  "captured": "2026-09-11T20:15:00Z",
  "captured_note": "Friday post-close snapshot, pulled Sunday. Quotes are stale by design of when they were taken \u2014 this proves the fields exist, it is not a live reading.",
  "underlying": "SPX",
  "chain": "SPXW",
  "expiry": "2026-09-14",
  "spot": 7657.0,
  "spot_method": "Interpolated from the delta-0.5 crossing between the 7650 call (delta 0.564) and the 7675 call (delta 0.354). Not a quoted index level \u2014 SPX spot was not fetched directly.",
  "type": "call",
  "rows": [
    {
      "k": 7575,
      "iv": 0.168314,
      "delta": 0.900174,
      "gamma": 0.002694,
      "theta": -6.840255,
      "vega": 0.677502,
      "oi": 263,
      "vol": 119,
      "bid": 85.4,
      "ask": 86.2,
      "mark": 85.8,
      "gex": 41540396.168778,
      "moneyness": -0.0107091550215489
    },
    {
      "k": 7600,
      "iv": 0.154364,
      "delta": 0.835192,
      "gamma": 0.004157,
      "theta": -8.616705,
      "vega": 0.95879,
      "oi": 738,
      "vol": 1016,
      "bid": 62.7,
      "ask": 63.2,
      "mark": 62.95,
      "gex": 179867906.759034,
      "moneyness": -0.007444168734491274
    },
    {
      "k": 7650,
      "iv": 0.127476,
      "delta": 0.56357,
      "gamma": 0.007993,
      "theta": -10.880218,
      "vega": 1.52244,
      "oi": 689,
      "vol": 4082,
      "bid": 23.6,
      "ask": 23.9,
      "mark": 23.75,
      "gex": 322883854.49087304,
      "moneyness": -0.000914196160376135
    },
    {
      "k": 7675,
      "iv": 0.118225,
      "delta": 0.353976,
      "gamma": 0.008138,
      "theta": -9.41762,
      "vega": 1.437568,
      "oi": 1878,
      "vol": 27202,
      "bid": 10.8,
      "ask": 11.0,
      "mark": 10.9,
      "gex": 896046540.9294358,
      "moneyness": 0.00235079012668149
    },
    {
      "k": 7700,
      "iv": 0.114048,
      "delta": 0.170195,
      "gamma": 0.005745,
      "theta": -6.136551,
      "vega": 0.978862,
      "oi": 1626,
      "vol": 11535,
      "bid": 3.9,
      "ask": 4.1,
      "mark": 4.0,
      "gex": 547681244.27913,
      "moneyness": 0.005615776413739004
    },
    {
      "k": 7750,
      "iv": 0.118075,
      "delta": 0.022399,
      "gamma": 0.001168,
      "theta": -1.325179,
      "vega": 0.205973,
      "oi": 1765,
      "vol": 3978,
      "bid": 0.35,
      "ask": 0.4,
      "mark": 0.375,
      "gex": 120866194.00648,
      "moneyness": 0.012145748987854255
    },
    {
      "k": 7800,
      "iv": 0.140238,
      "delta": 0.004705,
      "gamma": 0.000253,
      "theta": -0.402846,
      "vega": 0.052942,
      "oi": 2966,
      "vol": 2859,
      "bid": 0.05,
      "ask": 0.1,
      "mark": 0.075,
      "gex": 43995571.350302,
      "moneyness": 0.018675721561969505
    },
    {
      "k": 7850,
      "iv": 0.152251,
      "delta": 0.000635,
      "gamma": 3.8e-05,
      "theta": -0.070625,
      "vega": 0.008568,
      "oi": 819,
      "vol": 18336,
      "bid": 0.0,
      "ask": 0.1,
      "mark": 0.05,
      "gex": 1824671.9361780004,
      "moneyness": 0.025205694136084533
    }
  ],
  "total_gex": 2154706379.9202113,
  "wall_strike": 7675,
  "wall_gex": 896046540.9294358,
  "floor_strike": 7700,
  "floor_iv": 0.114048,
  "coverage_note": "Calls only, one expiry, eight strikes. A full surface needs puts as well and several expiries \u2014 that is one more pull, not a different capability.",
  "greeks_gap_note": "Deep in-the-money strikes (7100-7300) returned null greeks and null implied volatility on the same call. Sparse coverage away from the money is real and must be handled, not assumed away.",
  "snapshots_available": [
    "spxw-2026-09-11T2015Z.json"
  ]
};
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m$ = n => n>=1e9 ? "$"+(n/1e9).toFixed(2)+"B" : n>=1e6 ? "$"+(n/1e6).toFixed(0)+"M" : "$"+Math.round(n).toLocaleString();

$("sub").textContent = `${D.underlying} · ${D.chain} · expiry ${D.expiry} · ${D.type}s`;
$("stamp").innerHTML = `snapshot ${esc(D.captured)}<br>built ${esc(D.built)}`;
$("foot").textContent = `Rendered from ${D.snapshot}. Every figure fetched from the broker's option chain — none modelled, none invented.`;

$("strip").innerHTML = [
  ["Spot (derived)", D.spot.toLocaleString("en-US",{maximumFractionDigits:0}), "from the delta-0.5 crossing"],
  ["Gamma wall", D.wall_strike.toLocaleString(), m$(D.wall_gex)+" per 1% move", "var(--gex)"],
  ["Total gamma", m$(D.total_gex), D.rows.length+" strikes sampled"],
  ["Vol floor", D.floor_strike.toLocaleString(), (D.floor_iv*100).toFixed(2)+"% implied", "var(--iv)"],
].map(([k,v,s,c])=>`<div class="cell"><div class="lbl">${k}</div>
  <div class="v num" ${c?`style="color:${c}"`:""}>${v}</div><div class="s">${s}</div></div>`).join("");

const W=560, H=290, PL=54, PR=16, PT=16, PB=34;
const ks = D.rows.map(r=>r.k);
const kmin=Math.min(...ks), kmax=Math.max(...ks);
const x = k => PL + (k-kmin)/(kmax-kmin||1)*(W-PL-PR);
const axis = (svg, ticks, fmt) => ticks.map(t=>
  `<text x="${x(t).toFixed(1)}" y="${H-PB+16}" text-anchor="middle" fill="var(--faint)" font-size="9.5"
    font-family="JetBrains Mono,monospace">${fmt(t)}</text>`).join("");
const spotLine = `<line x1="${x(D.spot).toFixed(1)}" y1="${PT}" x2="${x(D.spot).toFixed(1)}" y2="${H-PB}"
  stroke="var(--spot)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="${x(D.spot).toFixed(1)}" y="${PT-4}" text-anchor="middle" fill="var(--spot)" font-size="9.5"
   font-family="JetBrains Mono,monospace">SPOT ${D.spot.toLocaleString("en-US",{maximumFractionDigits:0})}</text>`;

/* ---- smile ---- */
(function(){
  const ivs=D.rows.map(r=>r.iv), lo=Math.min(...ivs)*0.96, hi=Math.max(...ivs)*1.04;
  const y = v => PT + (1-(v-lo)/(hi-lo))*(H-PT-PB);
  const pts = D.rows.map(r=>`${x(r.k).toFixed(1)},${y(r.iv).toFixed(1)}`).join(" ");
  let g = `<rect x="0" y="0" width="${W}" height="${H}" fill="none"/>`;
  for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, yy=y(v).toFixed(1);
    g+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>
        <text x="${PL-7}" y="${(+yy+3).toFixed(1)}" text-anchor="end" fill="var(--faint)" font-size="9.5"
         font-family="JetBrains Mono,monospace">${(v*100).toFixed(1)}%</text>`; }
  g += spotLine;
  g += `<polyline points="${pts}" fill="none" stroke="var(--iv)" stroke-width="2"/>`;
  D.rows.forEach(r=>{
    const isFloor = r.k===D.floor_strike;
    g+=`<circle cx="${x(r.k).toFixed(1)}" cy="${y(r.iv).toFixed(1)}" r="${isFloor?4.5:3}"
        fill="${isFloor?"var(--spot)":"var(--iv)"}"/>`;
    if(isFloor) g+=`<text x="${x(r.k).toFixed(1)}" y="${(y(r.iv)+17).toFixed(1)}" text-anchor="middle"
        fill="var(--spot)" font-size="9.5" font-family="JetBrains Mono,monospace">floor ${(r.iv*100).toFixed(1)}%</text>`;
  });
  g += axis(null, ks.filter((_,i)=>i%2===0), t=>t.toLocaleString());
  $("smile").setAttribute("viewBox",`0 0 ${W} ${H}`); $("smile").innerHTML=g;
  $("ivlab").textContent = `${(Math.min(...ivs)*100).toFixed(1)}% – ${(Math.max(...ivs)*100).toFixed(1)}%`;
})();

/* ---- gamma exposure ---- */
(function(){
  const gs=D.rows.map(r=>r.gex), gmax=Math.max(...gs);
  const y = v => PT + (1-v/(gmax*1.08))*(H-PT-PB);
  const bw = Math.max(6,(W-PL-PR)/D.rows.length*0.55);
  let g="";
  for(let i=0;i<=4;i++){ const v=gmax*1.08*i/4, yy=y(v).toFixed(1);
    g+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>
        <text x="${PL-7}" y="${(+yy+3).toFixed(1)}" text-anchor="end" fill="var(--faint)" font-size="9.5"
         font-family="JetBrains Mono,monospace">${v>=1e9?(v/1e9).toFixed(1)+"B":(v/1e6).toFixed(0)+"M"}</text>`; }
  g += spotLine;
  D.rows.forEach(r=>{
    const isWall = r.k===D.wall_strike;
    const yy=y(r.gex), h=Math.max(1,(H-PB)-yy);
    g+=`<rect x="${(x(r.k)-bw/2).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
        fill="var(--gex)" opacity="${isWall?"1":"0.45"}"/>`;
    if(isWall) g+=`<text x="${x(r.k).toFixed(1)}" y="${(yy-6).toFixed(1)}" text-anchor="middle"
        fill="var(--gex)" font-size="10" font-weight="700" font-family="JetBrains Mono,monospace">WALL</text>`;
  });
  g += axis(null, ks.filter((_,i)=>i%2===0), t=>t.toLocaleString());
  $("gex").setAttribute("viewBox",`0 0 ${W} ${H}`); $("gex").innerHTML=g;
  $("gexlab").textContent = `peak ${m$(D.wall_gex)} at ${D.wall_strike.toLocaleString()}`;
})();

/* ---- table ---- */
$("nlab").textContent = D.rows.length + " strikes";
$("tbl").innerHTML = `<thead><tr><th>Strike</th><th>Moneyness</th><th>Implied vol</th><th>Delta</th>
  <th>Gamma</th><th>Open int</th><th>Volume</th><th>Gamma $ / 1%</th></tr></thead><tbody>` +
  D.rows.map(r=>`<tr class="${r.k===D.wall_strike?"wall":""}">
    <td class="num"><b>${r.k.toLocaleString()}</b></td>
    <td class="num">${(r.moneyness*100).toFixed(2)}%</td>
    <td class="num" style="color:var(--iv)">${(r.iv*100).toFixed(2)}%</td>
    <td class="num">${r.delta.toFixed(3)}</td>
    <td class="num">${r.gamma.toFixed(6)}</td>
    <td class="num">${r.oi.toLocaleString()}</td>
    <td class="num">${r.vol.toLocaleString()}</td>
    <td class="num" style="color:var(--gex)">${m$(r.gex)}</td></tr>`).join("") + "</tbody>";

$("honesty").innerHTML =
  `<b>What this is, and what it is not.</b> ${esc(D.captured_note)} ${esc(D.spot_method)}
   <br><br><b>Coverage:</b> ${esc(D.coverage_note)} ${esc(D.greeks_gap_note)}
   <br><br><b>A true three-dimensional surface needs several expiries.</b> This is one slice through it —
   implied volatility against strike at a single expiry, which is the skew the source describes. Adding
   expiries is one more pull from the same endpoint, not a different capability.`;
</script>
